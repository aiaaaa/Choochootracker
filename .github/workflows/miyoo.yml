name: MiyooPorts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miyooports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zip unzip
      - name: Build MiyooPorts package
        run: |
          chmod +x tracker/check-docker.sh
          make -C tracker -j4 MiyooPorts-deploy
          package=$(find ../releases -maxdepth 1 -type f -name '*-MiyooPorts.zip' -print -quit)
          test -n "$package"
          mkdir -p releases
          cp "$package" releases/
          unzip -t "releases/$(basename "$package")"
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-miyooports
          path: releases/*-MiyooPorts.zip
          if-no-files-found: error
