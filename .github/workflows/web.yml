name: Web

on:
  push:
    branches: ['personal/r36h']
  workflow_dispatch:
    inputs:
      target:
        description: Build only, preview, or production
        type: choice
        options: [build, preview, production]
        default: build

permissions:
  contents: read

# Do not cancel an in-flight production publication. Skip obsolete commits below.
concurrency:
  group: personal-web
  cancel-in-progress: false

jobs:
  web:
    if: github.ref == 'refs/heads/personal/r36h'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.10'
          actions-cache-folder: .tmp/emsdk-cache
      - name: Build pinned Lucky decoder for WebAssembly
        run: |
          MOD_LUCKY_DEPS_DIR="$GITHUB_WORKSPACE/.tmp/mod-lucky-web" \
            emconfigure scripts/build-mod-lucky-dependency.sh --host=wasm32-unknown-emscripten
      - name: Compile and validate fresh Web bundle
        run: python3 tools/web_bundle.py build
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-web-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Lucky relay
        run: node --test tools/test_lucky_relay.cjs
      - name: Deploy the validated bundle
        if: env.DEPLOY_TARGET != 'build'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN Actions secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID Actions secret}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_PROJECT_ID Actions secret}"
          args=()
          environment=preview
          if [[ "$DEPLOY_TARGET" == production ]]; then
            args+=(--prod)
            environment=production
          fi
          npx --yes vercel@63.1.2 pull --yes --environment="$environment" --token="$VERCEL_TOKEN"
          npx --yes vercel@63.1.2 build "${args[@]}" --token="$VERCEL_TOKEN"
          python3 tools/web_bundle.py validate --require-clean --directory .vercel/output/static
          test -s .vercel/output/functions/api/lucky.func/.vc-config.json
          test -s .vercel/output/functions/api/lucky.func/api/lucky.js
          cmp api/lucky.js .vercel/output/functions/api/lucky.func/api/lucky.js
          if [[ "$DEPLOY_TARGET" == production ]]; then
            head_sha=$(git ls-remote --exit-code origin refs/heads/personal/r36h | cut -f1)
            if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
              echo 'A newer personal/r36h commit exists; skipping obsolete production publication.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          npx --yes vercel@63.1.2 deploy --prebuilt "${args[@]}" --yes --json --token="$VERCEL_TOKEN" \
            --meta "githubCommitSha=$GITHUB_SHA" --meta 'githubCommitRef=personal/r36h' \
            --meta "githubCommitRepo=${GITHUB_REPOSITORY#*/}" --meta "githubCommitOrg=${GITHUB_REPOSITORY%/*}" \
            > "$RUNNER_TEMP/vercel-deployment.json"
          url=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d=d.get("deployment",d); assert d["readyState"] == "READY", d; print(d.get("productionUrl") or d["url"])' "$RUNNER_TEMP/vercel-deployment.json")
          printf 'Deployment: %s\nCommit: %s\n' "$url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DEPLOY_TARGET" == production ]]; then
            # A ready deployment can precede propagation of its production alias.
            # Retry both temporary HTTP errors and a previous deployment's manifest.
            verified=false
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
                "$url/build-info.json?commit=$GITHUB_SHA" -o "$RUNNER_TEMP/deployed-build-info.json" \
                && cmp -s web/dist/build-info.json "$RUNNER_TEMP/deployed-build-info.json"; then
                verified=true
                break
              fi
              sleep 5
            done
            if [[ "$verified" != true ]]; then
              echo 'Public production manifest did not match the compiled artifact within the verification window.' >&2
              exit 1
            fi
            echo 'Verified public build-info.json matches the compiled artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
