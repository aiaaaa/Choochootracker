name: PortMaster

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portmaster:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build PortMaster package
        run: |
          image=ghcr.io/monkeyx-net/portmaster-build-templates/portmaster-builder:aarch64-latest
          docker pull --platform linux/arm64 "$image"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/tracker "$image" bash -lc \
            "make -B -j4 -f Makefile.portmaster PortMaster-deploy \
              COMMON_CFLAGS='-std=c++17 -Wall -g -Os -DTEST' CXX=g++ STRIP=strip"
          unzip -t releases/choochootracker.zip
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-portmaster
          path: releases/choochootracker.zip
          if-no-files-found: error
