name: Vita candidates
on:
  workflow_dispatch:
  push:
    branches: ['personal/vita', 'candidate/vita/**']
    paths: ['tracker/**', 'chipnomad_lib/**', 'scripts/**', 'personal-features.json', 'docs/**', '.github/workflows/vita.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [ordinary, personal]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Host regression and update workflow
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          python3 scripts/test_vita_workflow.py
          MOD_LUCKY_DEPS_DIR="$PWD/.tmp/vita-host-xmp" scripts/build-mod-lucky-dependency.sh
          make -C tracker -f Makefile.test -j4 BUILD_DIR=build/vita-host-off
          make -C tracker -f Makefile.test -j4 BUILD_DIR=build/vita-host-on CHOOCHOO_EXPERIMENTAL_MOD_LUCKY=1 MOD_LUCKY_PREFIX="$PWD/.tmp/vita-host-xmp/prefix"
      - name: Pinned SDK and native candidate
        run: |
          docker pull "$(python3 -c 'import json; print(json.load(open("scripts/vita-sdk.json"))["image"])')"
          scripts/vita.sh doctor
          scripts/vita.sh build --profile '${{ matrix.profile }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vita-${{ matrix.profile }}-${{ github.sha }}
          path: releases/vita/candidates/*
          if-no-files-found: error
